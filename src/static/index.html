<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="account-menu">
        <button id="account-button" type="button" aria-label="Teacher account" aria-expanded="false" aria-controls="account-panel">&#128100;</button>
        <div id="account-panel" class="hidden">
          <span id="account-status">Student view</span>
          <button id="login-button" type="button">Teacher login</button>
          <button id="logout-button" type="button" class="hidden">Log out</button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <p id="login-notice">Teacher login is required to register or unregister students.</p>
        <form id="signup-form" class="hidden">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden" role="status"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher login</h3>
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" autocomplete="username" maxlength="100" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" maxlength="1024" required />
        </div>
        <p id="login-error" role="alert"></p>
        <button type="submit">Log in</button>
        <button id="cancel-login" type="button">Cancel</button>
      </form>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
